# Checks the kit on every pull request: tokens, lint and types, the published
# declarations and Terrazzo plugin, the exports map, and a native build of the
# example app on both platforms (macOS runners are free for a public repo).
# Publishing is release.yml.

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build the default theme
        run: bun run tokens

      - name: Lint, format and type-check
        run: bun run check

      - name: Emit the declarations
        run: bun run build:types

      - name: Build the Terrazzo plugin
        run: bun run build:terrazzo

      - name: Check that every export lists types first
        run: bun tools/check-exports.ts

  android:
    name: Build the example app for Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the kit
        run: bun i --frozen-lockfile

      - name: Build the default theme
        run: bun run tokens

      # The example depends on the kit through `link:`, which resolves against
      # the package `bun link` registers here.
      - name: Register the kit for link
        run: bun link

      - name: Install the example
        working-directory: example
        run: bun i --frozen-lockfile

      - name: Generate the native project
        working-directory: example
        run: bunx expo prebuild --platform android --no-install

      - name: Assemble the debug build
        working-directory: example/android
        run: ./gradlew assembleDebug

  ios:
    name: Build the example app for iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install the kit
        run: bun i --frozen-lockfile

      - name: Build the default theme
        run: bun run tokens

      # The example depends on the kit through `link:`, which resolves against
      # the package `bun link` registers here.
      - name: Register the kit for link
        run: bun link

      - name: Install the example
        working-directory: example
        run: bun i --frozen-lockfile

      - name: Generate the native project and install pods
        working-directory: example
        run: bunx expo prebuild --platform ios

      - name: Build for the simulator
        working-directory: example/ios
        run: |
          workspace="$(ls -d *.xcworkspace | head -n 1)"
          scheme="${workspace%.xcworkspace}"
          xcodebuild \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
